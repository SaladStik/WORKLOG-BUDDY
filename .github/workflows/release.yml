name: Release

# Builds the extension and publishes a GitHub Release with the packaged .vsix.
# Two ways to trigger it:
#   1. Push a version tag (e.g. `git push --follow-tags` after `npm version patch`).
#   2. Run it manually from the Actions tab and type a tag (e.g. v0.0.2) - the tag
#      and Release are created for you at the current commit.
on:
  push:
    tags:
      - 'v[0-9]*' # v1.2.3, v0.0.2, …
      - '[0-9]*' #  1.2.3, 0.1, …
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.0.2)'
        required: true

permissions:
  contents: write # required to create the tag, the Release, and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: worklog-buddy-vsix
          path: worklog-buddy.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the pushed tag; on a manual run it's the tag you typed.
          # softprops/action-gh-release creates the tag at this commit if it doesn't exist.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: worklog-buddy.vsix
          generate_release_notes: true
